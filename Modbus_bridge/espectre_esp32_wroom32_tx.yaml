esphome:
  name: espectre-wroom32-tx
  friendly_name: ESPectre WROOM32 TX

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components
    components: [espectre]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true

logger:
  level: INFO

api:

ota:
  - platform: esphome

espectre:
  traffic_generator_mode: espnow
  traffic_generator_rate: 100
  movement_sensor:
    name: None
  motion_sensor:
    name: None
  threshold_number:
    name: None
  calibrate_switch:
    name: None
