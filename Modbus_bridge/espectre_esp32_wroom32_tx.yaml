esphome:
  name: espectre-wroom32-tx
  friendly_name: TOMMY WROOM32 Node
  min_version: 2026.7.0

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: http://homeassistant.local:8090/tommy-esphome
      ref: main
    components: [sensor_tommy]
    refresh: 1d

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true

logger:
  level: INFO

api:

ota:
  - platform: esphome

sensor_tommy:
  discovery: mdns
