esphome:
  name: modbus-bridge
  friendly_name: RS485 Modbus Bridge
  # Ensures the RS485 channel-enable pin is driven high before anything
  # else tries to use the bus.
#   on_boot:
#     priority: 600
#     then:
#       - switch.turn_on: rs485_enable

esp32:
  variant: esp32
  framework:
    type: esp-idf

# ethernet:
#   type: LAN8720
#   mdc_pin: GPIO23
#   mdio_pin: GPIO18
#   clk_mode: GPIO17_OUT
#   phy_addr: 0

web_server:
  port: 80
  version: 3

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Static IP recommended so the gateway's address never changes under
  # whatever Modbus client (Home Assistant, etc.) you point at it.
#   manual_ip:
#     static_ip: 192.168.1.50      # <-- change to your network
#     gateway: 192.168.1.1         # <-- change to your network
#     subnet: 255.255.255.0
  power_save_mode: none
  fast_connect: true

logger:
  level: DEBUG

api:

ota:
  - platform: esphome
    # Recommended: set a password once your setup is stable.
    # password: !secret ota_password

# --- RS485 channel enable (GPIO47) ---
# On this board, GPIO47 must be HIGH to enable the RS485 transceiver.
# restore_mode: ALWAYS_ON re-asserts this on every boot automatically.
switch:
  - platform: gpio
    name: "a2-light1"
    pin: 15
    inverted: False
  - platform: gpio
    name: "a2-light2"
    pin: 2
    inverted: False

binary_sensor:
  - platform: gpio
    name: "a2-input1"
    pin:
      number: 36
      inverted: true
  - platform: gpio
    name: "a2-input2"
    pin:
      number: 39
      inverted: true

uart:
  - id: uart_bus
    tx_pin: GPIO32
    rx_pin: GPIO35
    baud_rate: 9600          # match your RS485 device's settings
    data_bits: 8
    parity: NONE
    stop_bits: 1
    #flow_control_pin: GPIO21   # RS485 DE/RE pin on this board

# ABB B23 Modbus RTU master. Set the meter to the same serial settings and
# Modbus address; the default address below is 1.
modbus:
  id: modbus_master
  uart_id: uart_bus
  send_wait_time: 200ms
  turnaround_time: 100ms

modbus_controller:
  - id: abb_b23
    address: 1
    modbus_id: modbus_master
    setup_priority: -10
    update_interval: 10s

sensor:
  - platform: modbus_controller
    modbus_controller_id: abb_b23
    name: "ABB B23 Spannung L1-N"
    address: 0x5B00
    register_type: holding
    value_type: U_DWORD
    accuracy_decimals: 1
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: abb_b23
    name: "ABB B23 Spannung L2-N"
    address: 0x5B02
    register_type: holding
    value_type: U_DWORD
    accuracy_decimals: 1
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: abb_b23
    name: "ABB B23 Spannung L3-N"
    address: 0x5B04
    register_type: holding
    value_type: U_DWORD
    accuracy_decimals: 1
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: abb_b23
    name: "ABB B23 Strom L1"
    address: 0x5B0C
    register_type: holding
    value_type: U_DWORD
    accuracy_decimals: 2
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: abb_b23
    name: "ABB B23 Strom L2"
    address: 0x5B0E
    register_type: holding
    value_type: U_DWORD
    accuracy_decimals: 2
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: abb_b23
    name: "ABB B23 Strom L3"
    address: 0x5B10
    register_type: holding
    value_type: U_DWORD
    accuracy_decimals: 2
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: abb_b23
    name: "ABB B23 Wirkleistung gesamt"
    address: 0x5B14
    register_type: holding
    value_type: S_DWORD
    accuracy_decimals: 2
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: abb_b23
    name: "ABB B23 Frequenz"
    address: 0x5B2C
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 2
    unit_of_measurement: Hz
    device_class: frequency
    state_class: measurement
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    modbus_controller_id: abb_b23
    name: "ABB B23 Energie Bezug"
    address: 0x5002
    register_type: holding
    value_type: U_DWORD
    accuracy_decimals: 2
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    filters:
      - multiply: 0.01