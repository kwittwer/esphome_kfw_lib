substitutions:
  name: "iotorrero-ethernet-controller"
  max_leds: "400"            # Maximaler Puffer fuer den Strip / Laufzeit-Obergrenze
  active_leds_default: "96"  # Startwert der aktuell genutzten LEDs

  # Laufzeit-Grenzen zwischen Segmenten
  boundary_1_2: "18"
  boundary_2_3: "37"
  boundary_3_4: "56"
  boundary_4_5: "75"

esphome:
  name: ${name}
  comment: "IoTorero/Athom Ethernet Controller mit nativer CCT-Segmentierung"

external_components:
  - source:
      type: git
      url: https://github.com/kwittwer/esphome_kfw_lib.git
      ref: main
      path: IoTorrero/components
    components: [ws2811_cwww]

# external_components:
#   - source:
#       type: local
#       path: components
#     components: [ws2811_cwww]

esp32:
  board: esp32dev
  framework:
    type: esp-idf


# Aktiviert die kabelgebundene Ethernet-Verbindung des Controllers
# ethernet:
#   type: LAN8720
#   mdc_pin: GPIO23
#   mdio_pin: GPIO18
#   clk_mode: GPIO0_IN
#   phy_addr: 0
#   # Optional: Wenn dein Netzwerk kein DHCP hat, kannst du hier eine "manual_ip:" setzen.

# Fallback-WLAN (falls das Ethernet-Kabel mal abgezogen wird)
api:
  encryption:
    key: !secret api_enc

ota:
  - platform: esphome
    password: !secret ota_pwd

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name}"
    password: !secret ap_pwd

logger:

web_server:
  port: 80

ws2811_cwww:
  id: segment_hub
  addressable_light_id: led_stripe_hardware
  num_leds: ${max_leds}
  active_leds: ${active_leds_default}
  boundary_transition_length: 900ms
  active_leds_transition_length: 1200ms
  min_segment_length: 4
  boundaries:
    - ${boundary_1_2}
    - ${boundary_2_3}
    - ${boundary_3_4}
    - ${boundary_4_5}

light:
  # 1. Das physikalische Hauptband am RMT-Bus (wird in HA versteckt)
  - platform: esp32_rmt_led_strip
    chipset: WS2811
    channel_colors: GRB     # Rot = Warmweiß, Grün = Kaltweiß
    pin: GPIO33
    num_leds: ${max_leds}
    id: led_stripe_hardware
    internal: true

  # 2. Die segmentierten CWWW-Lichter für Home Assistant
  - platform: ws2811_cwww
    name: "Küchenlicht Zone 1"
    id: seg_1
    ws2811_cwww_id: segment_hub
    segment_index: 0
    restore_mode: RESTORE_DEFAULT_OFF
    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 2700 K
    center_power_transition: true
    center_power_transition_overlap: 45%
    power_on_transition_length: 1200ms
    power_off_transition_length: 900ms
    effects:
      - addressable_lambda:
          name: "Segment 1 Laufpixel"
          update_interval: 16ms
          lambda: |-
            const uint8_t base_level = 51;
            if (it.size() <= 0) {
              return;
            }
            const uint32_t step_ms = id(segment_chase_step_ms).state < 10.0f
                                         ? 10
                                         : static_cast<uint32_t>(id(segment_chase_step_ms).state);
            const uint32_t now = millis();
            static uint32_t start_time = 0;
            if (initial_run) {
              start_time = now;
            }
            it.all() = current_color * base_level;
            if (it.size() == 1) {
              it[0] = current_color;
              return;
            }
            const uint32_t span = static_cast<uint32_t>(it.size() - 1);
            const uint32_t cycle_steps = span * 2;
            const uint32_t cycle_time = cycle_steps * step_ms;
            const uint32_t elapsed = (now - start_time) % cycle_time;
            const uint32_t hop_index = elapsed / step_ms;
            const float phase = static_cast<float>(elapsed % step_ms) / static_cast<float>(step_ms);
            const auto smoothstep = [](float value) -> float {
              if (value <= 0.0f) {
                return 0.0f;
              }
              if (value >= 1.0f) {
                return 1.0f;
              }
              return value * value * (3.0f - 2.0f * value);
            };
            const auto ping_pong_index = [&](uint32_t index) -> int {
              const uint32_t wrapped = index % cycle_steps;
              if (wrapped <= span) {
                return static_cast<int>(wrapped);
              }
              return static_cast<int>(cycle_steps - wrapped);
            };
            const int current_pixel = ping_pong_index(hop_index);
            const int next_pixel = ping_pong_index(hop_index + 1);
            float current_weight = 1.0f;
            float next_weight = 1.0f;
            if (phase < 0.5f) {
              next_weight = smoothstep(phase * 2.0f);
            } else {
              current_weight = 1.0f - smoothstep((phase - 0.5f) * 2.0f);
            }
            const uint8_t current_level = static_cast<uint8_t>(base_level + (255 - base_level) * current_weight);
            const uint8_t next_level = static_cast<uint8_t>(base_level + (255 - base_level) * next_weight);
            it[current_pixel] = current_color * current_level;
            it[next_pixel] = current_color * next_level;
      - pulse:
          name: "Segment 1 Puls"
          transition_length: 1s
          update_interval: 1s
          min_brightness: 15%
          max_brightness: 100%
      - strobe:
          name: "Segment 1 Strobe"
          colors:
            - state: true
              cold_white: 100%
              warm_white: 25%
              duration: 400ms
            - state: false
              duration: 250ms

  - platform: ws2811_cwww
    name: "Küchenlicht Zone 2"
    id: seg_2
    ws2811_cwww_id: segment_hub
    segment_index: 1
    restore_mode: RESTORE_DEFAULT_OFF
