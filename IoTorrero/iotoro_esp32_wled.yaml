      - pulse:
          name: "Segment 2 Puls"
          transition_length:
            on_length: 750ms
            off_length: 1250ms
          update_interval: 1200ms
          min_brightness: 10%
          max_brightness: 90%
      - strobe:
          name: "Segment 2 Wechsel"
          colors:
            - state: true
              cold_white: 100%
              warm_white: 0%
              duration: 500ms
            - state: true
              cold_white: 0%
              warm_white: 100%
              duration: 500ms

  - platform: ws2811_cwww
    name: "Küchenlicht Zone 3"
    id: seg_3
    ws2811_cwww_id: segment_hub
    segment_index: 2
    restore_mode: RESTORE_DEFAULT_OFF
