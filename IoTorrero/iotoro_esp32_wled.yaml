      - pulse:
          name: "Segment 5 Softpuls"
          transition_length: 2200ms
          update_interval: 2200ms
          min_brightness: 8%
          max_brightness: 45%
      - strobe:
          name: "Segment 5 Warmblitz"
          colors:
            - state: true
              cold_white: 15%
              warm_white: 100%
              duration: 280ms
            - state: false
              duration: 720ms

number:
  - platform: template
    name: "Laufpixel Schrittzeit"
    id: segment_chase_step_ms
    unit_of_measurement: "ms"
    min_value: 10
    max_value: 1000
    step: 10
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 120
    entity_category: config

  - platform: ws2811_cwww
    name: "Streifen aktive LED-Anzahl"
    id: active_led_count
    ws2811_cwww_id: segment_hub
    type: active_leds
    mode: BOX

  - platform: ws2811_cwww
    name: "Streifen Segmentgrenze 1-2"
    id: boundary_seg_1_2
    ws2811_cwww_id: segment_hub
    type: boundary
    boundary_index: 0

  - platform: ws2811_cwww
    name: "Streifen Segmentgrenze 2-3"
    id: boundary_seg_2_3
    ws2811_cwww_id: segment_hub
    type: boundary
    boundary_index: 1

  - platform: ws2811_cwww
    name: "Streifen Segmentgrenze 3-4"
    id: boundary_seg_3_4
    ws2811_cwww_id: segment_hub
    type: boundary
    boundary_index: 2

  - platform: ws2811_cwww
    name: "Streifen Segmentgrenze 4-5"
    id: boundary_seg_4_5
    ws2811_cwww_id: segment_hub
    type: boundary
    boundary_index: 3

switch:
  - platform: template
    name: "Küchenlicht Alle Zonen"
    id: all_segments_switch
    lambda: |-
      return id(seg_1).remote_values.is_on() ||
             id(seg_2).remote_values.is_on() ||
             id(seg_3).remote_values.is_on() ||
             id(seg_4).remote_values.is_on() ||
             id(seg_5).remote_values.is_on();
    turn_on_action:
      - light.turn_on: seg_1
      - light.turn_on: seg_2
      - light.turn_on: seg_3
      - light.turn_on: seg_4
      - light.turn_on: seg_5
    turn_off_action:
      - light.turn_off: seg_1
      - light.turn_off: seg_2
      - light.turn_off: seg_3
      - light.turn_off: seg_4
      - light.turn_off: seg_5
