          if (isnan(tstat->target_temperature)) {
            it.print(45, 14, id(tiny), "Soll: n/a");
          } else {
            it.printf(45, 14, id(tiny), "Soll: %.1f C", tstat->target_temperature);
          }

          it.printf(0, 24, id(tiny), "Ventil: %s", tstat->get_valve_state() ? "AN" : "AUS");
          it.printf(60, 24, id(tiny), "Out: %.0f%%", tstat->get_control_output());

          const char *mode_text = "UNKNOWN";
          switch (tstat->mode) {
            case climate::CLIMATE_MODE_OFF:
