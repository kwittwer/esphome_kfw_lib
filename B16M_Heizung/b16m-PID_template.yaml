text_sensor:
  - platform: template
    id: ip_addr
    name: "IP Address"
    update_interval: 5s
    lambda: |-
      auto ips = network::get_ip_addresses();
      for (auto &ip : ips) {
        if (!ip.is_set()) {
          continue;
        }
        char buf[network::IP_ADDRESS_BUFFER_SIZE];
        ip.str_to(buf);
        return {buf};
      }
      return {"n/a"};

  - platform: version
    name: "ESPHome Version"
    id: esphome_version_text
    hide_timestamp: true

  - platform: uptime
    name: Uptime
    id: uptime_text_readable
    entity_category: "diagnostic"
    format:
      separator: " "
      days: "D"

  - platform: template
    name: "Project Version:"
    id: project_version_text
    entity_category: "diagnostic"
    lambda: |-
      return {ESPHOME_PROJECT_VERSION};
    update_interval: 60s

  - platform: debug
    device:
      name: "Device Info"
    reset_reason:
      name: "Reset Reason"

globals:
  - id: heartbeat_blink
    type: bool
    restore_value: no
    initial_value: "false"
  - id: auto_rotate_display
    type: bool
    restore_value: yes
    initial_value: "true"
  - id: manual_control_enabled
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: last_manual_page_press_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

script:
  - id: display_next_page
    mode: restart
    then:
      - display.page.show_next: oled_display
      - component.update: oled_display

  - id: manual_next_page
    mode: restart
    then:
      - lambda: |-
          id(auto_rotate_display) = false;
          id(last_manual_page_press_ms) = millis();
      - script.execute: display_next_page

interval:
  - interval: 1s
    then:
      - lambda: |-
          id(heartbeat_blink) = !id(heartbeat_blink);
      - component.update: oled_display
      - if:
          condition:
            lambda: |-
              if (id(auto_rotate_display)) {
                return false;
              }
              return (millis() - id(last_manual_page_press_ms)) >= 180000UL;
          then:
            - lambda: |-
                id(auto_rotate_display) = true;

  - interval: 30s
    then:
      - if:
          condition:
            lambda: |-
              return id(auto_rotate_display);
          then:
            - script.execute: display_next_page

font:
  - file:
      type: gfonts
      family: "Open+Sans"
      weight: 400
    id: tiny
    size: 9

  - file:
      type: gfonts
      family: "Open+Sans"
      weight: 400
    id: small
    size: 12

  - file:
      type: gfonts
      family: "Open+Sans"
      weight: 400
    id: large
    size: 20

  - file:
      type: gfonts
      family: "Open+Sans"
      weight: 700
    id: bold
    size: 10

  - file: "../materialdesignicons-webfont.ttf"
    id: icon
    size: 16
    glyphs: [
        "\U000F02D1",  # mdi-heart
        "\U000F05D4",  # mdi-airplane-landing
        "\U000F0159",  # mdi-alert
        "\U000F0130",  # mdi-checkbox-blank-circle
        "\U000F0133",  # mdi-checkbox-marked-circle
        "\U000F012E",  # mdi-checkbox-blank
        "\U000F0132",  # mdi-checkbox-marked
        "\U000F0319",  # mdi-lan-disconnect
        "\U000F0318",  # mdi-lan-connect
        "\U000F050F",  # mdi-thermometer
        "\U000F058E",  # mdi-water-percent
        "\U000F1B17",  # mdi-thermostat
        "\U000F0026",   # mdi-Alert
      ]

display:
  - platform: ssd1306_i2c
    model: SSD1306_128X64
    id: oled_display
    i2c_id: bus_a
    address: 0x3c
    update_interval: 500ms
    pages:
      - id: page_home
        lambda: |-
          it.strftime(0, 0, id(large), "%H:%M", id(rtc_time).now());
          if (id(heartbeat_blink)) {
            it.print(110, 0, id(icon), "\U000F02D1");
          }
          it.printf(0, 28, id(small), "B16M");
          if (api::global_api_server->is_connected()) {
            it.print(48, 28, id(icon), "\U000F0318");
            it.print(66, 32, id(tiny), "HA OK");
          } else {
            it.print(48, 28, id(icon), "\U000F0319");
            it.print(66, 32, id(tiny), "HA OFF");
          }
          if (id(uptime_seconds).has_state()) {
            it.printf(0, 48, id(tiny), "Uptime: %.0fs", id(uptime_seconds).state);
          }

      - id: page_inputs
        lambda: |-
          it.print(0, 0, id(small), "Inputs");
          it.print(0, 16, id(icon), id(DI1_Hauptschalter).state ? "\U000F0133" : "\U000F0130");
          it.print(16, 16, id(icon), id(DI2).state ? "\U000F0133" : "\U000F0130");
          it.print(32, 16, id(icon), id(DI3).state ? "\U000F0133" : "\U000F0130");
          it.print(48, 16, id(icon), id(DI4).state ? "\U000F0133" : "\U000F0130");
          it.print(64, 16, id(icon), id(DI5).state ? "\U000F0133" : "\U000F0130");
          it.print(80, 16, id(icon), id(DI6).state ? "\U000F0133" : "\U000F0130");
          it.print(96, 16, id(icon), id(DI7).state ? "\U000F0133" : "\U000F0130");
          it.print(112, 16, id(icon), id(DI8).state ? "\U000F0133" : "\U000F0130");
          it.print(0, 34, id(icon), id(DI9).state ? "\U000F0133" : "\U000F0130");
          it.print(16, 34, id(icon), id(DI10).state ? "\U000F0133" : "\U000F0130");
          it.print(32, 34, id(icon), id(DI11).state ? "\U000F0133" : "\U000F0130");
