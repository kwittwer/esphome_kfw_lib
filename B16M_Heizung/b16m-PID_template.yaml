      number: 15
      mode: INPUT
      inverted: true

  - platform: gpio
    name: "DW"
    id: button_dw
    internal: true
    pin:
      number: GPIO0
      ignore_strapping_warning: true
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      then:
        - script.execute: manual_next_page



