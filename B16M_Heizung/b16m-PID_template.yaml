select:
  - platform: template
    name: "Steuerungsmodus"
    id: control_mode_select
    icon: "mdi:toggle-switch-outline"
    entity_category: "config"
    options:
      - "Automatik"
      - "Manuell"
    lambda: |-
      if (id(manual_control_enabled)) {
        return std::string("Manuell");
      }
      return std::string("Automatik");
    set_action:
      - lambda: |-
          id(manual_control_enabled) = (x == "Manuell");
      - logger.log:
          format: "Steuerungsmodus gesetzt: %s"
          args: [ 'x.c_str()' ]

  # ============================================
  # PID-THERMOSTAT BEISPIELKONFIGURATION
  #
  # Hinweis:
  # - Die Climate-Instanz erzeugt ihre Parameter- und Diagnose-Entities selbst.
  # - Kp/Ki/Kd, PWM Periode, PWM Min/Max, Taupunkt-Abstand, Reglerausgang,
  #   Modusstatus sowie die aktive Temperatur-/Feuchtequelle erscheinen automatisch.
  # - Die hier gezeigten auskommentierten Optionen koennen bei Bedarf pro Raum
  #   aktiviert oder angepasst werden.
  # ============================================
  # climate:
  #   - platform: pid_thermostat
  #     name: "Beispielraum"  # Typ: String. Anzeigename der Climate-Entity.
  #     id: beispiel_thermostat  # Typ: ESPHome-ID. Interner Name fuer Lambdas, Display und Automationen.
  #
  #     temperature_sensor: sensor_dht_1_temperature  # Typ: Sensor-ID. Hauptsensor fuer die Temperaturregelung.
  #     humidity_sensor: sensor_dht_1_humidity  # Typ: Sensor-ID. Hauptsensor fuer Feuchte und Taupunktberechnung.
  #
  #     # fallback_temperature_sensor: sensor_dht_2_temperature  # Typ: Sensor-ID. Optionaler Ersatzsensor, wenn temperature_sensor ausfaellt.
  #     # fallback_humidity_sensor: sensor_dht_2_humidity  # Typ: Sensor-ID. Optionaler Ersatzsensor, wenn humidity_sensor ausfaellt.
  #
  #     temperature_sensor_timeout: 10min  # Typ: Zeitwert. Nach dieser Zeit ohne Update wird auf fallback_temperature_sensor gewechselt.
  #     # fallback_temperature_sensor_timeout: 10min  # Typ: Zeitwert. Nach dieser Zeit ohne Update gilt auch der Temperatur-Fallback als ungueltig.
  #     humidity_sensor_timeout: 10min  # Typ: Zeitwert. Nach dieser Zeit ohne Update wird auf fallback_humidity_sensor gewechselt.
  #     # fallback_humidity_sensor_timeout: 10min  # Typ: Zeitwert. Nach dieser Zeit ohne Update gilt auch der Feuchte-Fallback als ungueltig.
  #
  #     valve_switch: DO1  # Typ: Switch-ID. Physischer Ausgang fuer das Ventil bzw. die PWM-Schaltung.
  #     valve_control_enabled: !lambda |-  # Typ: bool oder Lambda<bool>. Freigabe fuer die reale Ausgangsansteuerung.
  #       return (id(DI1_Hauptschalter).state && !id(manual_control_enabled));
  #
  #     kp: 5.0  # Typ: float. Proportionalanteil des PID-Reglers.
  #     ki: 0.01  # Typ: float. Integralanteil des PID-Reglers.
  #     kd: 500.0  # Typ: float. Differentialanteil des PID-Reglers.
  #
  #     pwm: 15min  # Typ: Zeitwert. Dauer eines PWM-Zyklus fuer die Ventilansteuerung.
  #     pwm_min: 0.0  # Typ: float 0..100. Untere Grenze des Reglerausgangs in Prozent.
  #     pwm_max: 100.0  # Typ: float 0..100. Obere Grenze des Reglerausgangs in Prozent.
  #
  #     sampling_period: 0s  # Typ: Zeitwert. 0s = Rechenlauf bei jedem Sensorupdate, sonst feste PID-Abtastung.
  #     keep_alive: 60s  # Typ: Zeitwert. Intervall fuer erneutes Anwenden des berechneten Ausgangszustands.
  #     min_cycle_duration: 0s  # Typ: Zeitwert. Mindestdauer, die das Ventil nach dem Einschalten an bleiben soll.
  #     min_off_cycle_duration: 0s  # Typ: Zeitwert. Mindestdauer, die das Ventil nach dem Ausschalten aus bleiben soll.
  #
  #     cold_tolerance: 0.3  # Typ: Temperaturwert in °C/K. Abschalt-/Ruhebereich im Kuehlmodus nahe Sollwert.
  #     hot_tolerance: 0.3  # Typ: Temperaturwert in °C/K. Abschalt-/Ruhebereich im Heizmodus nahe Sollwert.
  #     dew_point_offset: 1.0  # Typ: float in K. Sicherheitsabstand ueber dem Taupunkt im Kuehlmodus.
  #     output_safety: 5.0  # Typ: float 0..100 %. Sicherheitsausgang, falls keine gueltige Temperaturquelle verfuegbar ist.
  #     debug: false  # Typ: bool. Aktiviert zusaetzliche Regler-Debugausgaben im Log.
  #
  #     visual:  # Anzeigeparameter fuer die HA-UI, nicht fuer die eigentliche Reglerlogik.
  #       min_temperature: 15.0  # Typ: float. Kleinster einstellbarer Sollwert in der UI.
  #       max_temperature: 30.0  # Typ: float. Groesster einstellbarer Sollwert in der UI.
  #       temperature_step:
  #         target_temperature: 0.5  # Typ: float. Schrittweite fuer die Solltemperatur in der UI.
  #         current_temperature: 0.1  # Typ: float. Anzeigeauflosung fuer die Isttemperatur in der UI.

climate:

  - platform: pid_thermostat
    name: "Raum1"
    id: thermostat1
    temperature_sensor: sensor_dht_1_temperature
    humidity_sensor: sensor_dht_1_humidity
    fallback_temperature_sensor: sensor_dht_1_temperature
    fallback_humidity_sensor: sensor_dht_1_humidity
    temperature_sensor_timeout: 10min
    humidity_sensor_timeout: 10min
    valve_switch: DO1
    valve_control_enabled: !lambda |-
      return (id(DI1_Hauptschalter).state && !id(manual_control_enabled));
    kp: 5.0
