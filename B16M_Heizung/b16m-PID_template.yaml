          it.print(48, 34, id(icon), id(DO12).state ? "\U000F0133" : "\U000F0130");
          it.print(64, 34, id(icon), id(DO13).state ? "\U000F0133" : "\U000F0130");
          it.print(80, 34, id(icon), id(DO14).state ? "\U000F0133" : "\U000F0130");
          it.print(96, 34, id(icon), id(DO15).state ? "\U000F0133" : "\U000F0130");
