esphome:
  name: b16m-pidtemplate
  friendly_name: B16M_pidTemplate
  project:
    name: "Konrad.Heizungsregler"
    version: V2026.06.29

# Replace this with your actual platform if you aren't using ESP32.
esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  cpu_frequency: 240MHZ
  framework:
    type: esp-idf
    advanced:
      execute_from_psram: true
    sdkconfig_options:
      CONFIG_FATFS_LFN_STACK: "y"
  flash_size: 16MB

psram:
  mode: octal
  speed: 80MHz

ethernet:
  type: W5500
  clk_pin: GPIO42
  mosi_pin: GPIO43
  miso_pin: GPIO44
  cs_pin: GPIO41
  interrupt_pin: GPIO2
  reset_pin: GPIO1
  manual_ip:
    static_ip: "192.168.178.59"
    gateway: "192.168.178.1"
    subnet: "255.255.255.0"
    dns1: "192.168.178.1"


web_server:
  port: 80
  version: 3
  
logger:

debug:
  update_interval: 10s

external_components:
  - source:
      type: local
      path: ../components
    components: [pid_thermostat]

# ============================================
# TIME (DS1307 RTC + Home Assistant)
# ============================================
time:
  - platform: ds1307
    id: rtc_time
    timezone: "Europe/Berlin"
    update_interval: 1h
  - platform: homeassistant
    timezone: "Europe/Berlin"
    on_time_sync:
      then:
        ds1307.write_time:


api:
  reboot_timeout: 6h
  custom_services: true

ota:
  - platform: esphome
# ============================================
# I2C BUS
# ============================================
i2c:
  - id: bus_a
    sda: 38
    scl: 39
    scan: false
    frequency: 400kHz


# ============================================
# I/O EXPANDER (PCF8575)
# ============================================
pcf8574:
  - id: 'pcf8574_hub_in_1'
    i2c_id: bus_a
    address: "0x24"
    pcf8575: true

  - id: 'pcf8574_hub_out_1'
    i2c_id: bus_a
    address: "0x25"
    pcf8575: true


# ============================================
# DIGITAL INPUTS (DI1â€“DI16 via PCF8575)
# ============================================
binary_sensor:
